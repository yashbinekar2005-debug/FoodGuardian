version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: foodguardian-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: foodguardian
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: foodguardian-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodguardian-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/foodguardian
      SYNC_DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/foodguardian
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "False"
      API_SECRET: production-secret-key-foodguardian-32chars
      JWT_SECRET: production-jwt-secret-foodguardian-32chars
      CORS_ORIGINS: "*"
    ports:
      - "8001:8000"

volumes:
  pgdata:
  redisdata:
