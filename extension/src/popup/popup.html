<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodGuardian</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #16a34a;
      --text: #1e293b;
      --text-muted: #64748b;
      --bg: #ffffff;
      --card-bg: #f8fafc;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }

    .header {
      padding: 14px 16px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      color: var(--primary);
    }

    .shield {
      width: 22px;
      height: 22px;
      background: var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 900;
      font-size: 12px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #16a34a;
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #16a34a;
      border-radius: 50%;
      box-shadow: 0 0 6px #16a34a;
    }

    .content {
      padding: 16px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .rating-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .grade-badge {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      color: white;
    }

    .grade-A { background: #16a34a; }
    .grade-B { background: #65a30d; }
    .grade-C { background: #d97706; }
    .grade-D { background: #ea580c; }
    .grade-E { background: #dc2626; }
    .grade-F { background: #991b1b; }

    .btn-primary {
      width: 100%;
      padding: 9px 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }

    .btn-primary:hover {
      background: #1e293b;
    }

    .empty-state {
      text-align: center;
      padding: 24px 10px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .nav-links {
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 12px;
      padding: 4px 0;
      cursor: pointer;
    }

    .nav-item:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="shield">G</span>
      <span>FoodGuardian</span>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>Active</span>
    </div>
  </div>

  <div class="content">
    <div id="product-container">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">🔍</div>
        <p style="font-weight: 600; color: #0f172a; margin-bottom: 4px;">No Food Product Detected</p>
        <p style="font-size: 11px;">Open a packaged-food product page on Amazon, BigBasket, or Blinkit to view safety & regulatory insights.</p>
      </div>

      <div class="product-card" id="analyzed-card" style="display: none;">
        <div class="rating-row">
          <div class="grade-badge" id="grade-badge">B</div>
          <div>
            <h3 id="product-title" style="font-size: 13px; font-weight: 700; color: #0f172a; line-height: 1.3;">Product Name</h3>
            <div id="product-score" style="font-size: 11px; color: #64748b;">FoodGuardian Score: 78</div>
          </div>
        </div>
        <button class="btn-primary" id="btn-open-panel">
          <span>Open Detailed Analysis</span>
          <span>→</span>
        </button>
      </div>
    </div>
  </div>

  <div class="nav-links">
    <a class="nav-item" id="link-options">
      <span>Extension Settings</span>
      <span>›</span>
    </a>
    <a class="nav-item" id="link-methodology" href="http://localhost:8001/docs" target="_blank">
      <span>API & Documentation</span>
      <span>›</span>
    </a>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
